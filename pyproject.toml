[project]
name = "tunnel-fire-research"
version = "0.1.0"
description = "Reproducible analysis environment for the no-wind tunnel ceiling-temperature study"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mpmath==1.3.0",
    "numpy==2.4.6",
    "pysr==1.5.10",
    "scipy==1.17.1",
    "sympy==1.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
